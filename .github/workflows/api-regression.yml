name: API Regression Tests

on:
  #手工点 Run workflow
  workflow_dispatch:
  #有代码 Push/Commit 到 main，自动执行
  push:
    branches:
      - main
  #有 PR 准备合并到 main，自动执行
  pull_request:
    branches:
      - main
  #定时跑02:00 跑
  # schedule:
  #   - cron: '0 2 * * *'
jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      # - name: Install Postman CLI
      #   run: npm install -g postman-cli

      # - name: Login to Postman
      #   run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      # - name: Run API Regression Tests
      #   run: postman collection run 57816734-4b573811-9fe5-406e-8573-974f87232dac -e 57816734-a0747ef0-4fe0-4e06-b703-d473ba1eb668
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run API Regression Tests
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          #command: 'collection run 57816734-4b573811-9fe5-406e-8573-974f87232dac --environment postman/QA_Test.postman_environment.json'
          command: 'collection run postman/API-Automation-Demo.postman_collection.json --environment postman/QA_Test.postman_environment.json'
